# CI 引导用的部署配置。vite 用的入口配置在 wrangler.vite.toml(由 vite.config.ts
# 的 configPath 指向),两边共享的字段(name/compat/routes/preview_urls/observability)
# 改动时要同步。
#
# 为什么要拆两份:Workers Builds 的非生产分支默认只执行
# `npx wrangler versions upload`,不跑构建。而真正的部署配置是构建产物里的
# dist/server/wrangler.json(靠 .wrangler/deploy/config.json 重定向过去),
# 新克隆的仓库里两者都不存在。以前根配置的 main 是 vite 的入口标记
# "@tanstack/react-start/server-entry",wrangler 回落到根配置时就会报
# 「The entry-point file at ... was not found」。
#
# 现在根配置自己就是一份能部署的配置:main 指向构建产物,[build] 钩子先跑
# bun run build(wrangler 是先跑 custom build、再解析 main 的)。于是:
# - CI 新克隆:没有重定向 → 用本配置 → 钩子构建 → 上传 dist 产物,直接通。
# - 本地 bun run deploy / deploy:preview:脚本先构建,构建写出重定向 →
#   wrangler 走 dist/server/wrangler.json,行为不变。
name = "wutz-dev"
compatibility_date = "2026-06-03"
compatibility_flags = ["nodejs_compat"]

# 以下三项照抄 vite 产出的 dist/server/wrangler.json:产物已经打好包,
# 关掉 wrangler 自己的 bundling,按 ESModule 规则原样上传 dist/server/ 下的模块。
main = "dist/server/index.js"
no_bundle = true
rules = [
  { type = "ESModule", globs = ["**/*.js", "**/*.mjs"] }
]

# versions upload 上传的版本要拿到 <version>-wutz-dev.<subdomain>.workers.dev
# 预览地址,这个开关默认是 false,得显式打开。
preview_urls = true

routes = [
  { pattern = "wutz.dev", custom_domain = true }
]

[assets]
directory = "dist/client"

[build]
command = "bun run build"

[observability]
enabled = true
