<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!--
    实心盾牌 + 镂空钥匙孔:单色墨黑 ink,无渐变(Vercel 风格,ink 是唯一主色)。
    孔洞走 mask 真透明,不依赖底色;盾/孔只留一个语义,
    在小尺寸导航位也能读成清晰轮廓。

    本站把它当 <img> 用,CSS 够不着里面,所以极性翻转写在 SVG 内部:
    暗色下墨黑盾牌会糊在 #0a0a0a 的卡片上,换成 ink 的暗色取值 #ededed。
  -->
  <style>
    .shield { fill: #171717; stroke: #171717; }
    @media (prefers-color-scheme: dark) {
      .shield { fill: #ededed; stroke: #ededed; }
    }
  </style>

  <mask id="keyhole">
    <rect width="128" height="128" fill="white"/>
    <circle cx="64" cy="57" r="11.5" fill="black"/>
    <path d="M58.5 64.5 L52.5 90 L75.5 90 L69.5 64.5 Z" fill="black"/>
  </mask>

  <path
    class="shield"
    d="M64 16 C76 22 90 25 100 27 C100 60 91 95 64 112 C37 95 28 60 28 27 C38 25 52 22 64 16 Z"
    stroke-width="6"
    stroke-linejoin="round"
    mask="url(#keyhole)"
  />
</svg>
